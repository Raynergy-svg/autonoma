<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flow Agent">
  <defs>
    <linearGradient id="fa-tile" x1="0" y1="0" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b150d"/>
      <stop offset="1" stop-color="#0c0a07"/>
    </linearGradient>
  </defs>

  <!-- warm-night tile -->
  <rect x="1" y="1" width="46" height="46" rx="12" fill="url(#fa-tile)" stroke="#e6ad55" stroke-opacity="0.22"/>

  <!-- coral braces { } -->
  <g stroke="#f0876a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M11 14 C 7 14, 8.5 22, 6.5 24 C 8.5 26, 7 34, 11 34"/>
    <path d="M37 14 C 41 14, 39.5 22, 41.5 24 C 39.5 26, 41 34, 37 34"/>
  </g>

  <!-- nose / mouth dot (shared) -->
  <circle cx="24" cy="29" r="1.9" fill="#f0c46a"/>

  <!-- animated eyes: >.<  →  >.>  →  <.<  →  blink -->
  <g stroke="#f0c46a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- A: >.<  (rest) -->
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="1;0;0;0;1;1" keyTimes="0;0.5;0.667;0.833;0.9;1" dur="6s" repeatCount="indefinite"/>
      <path d="M13 18 L20 23 L13 28"/>
      <path d="M35 18 L28 23 L35 28"/>
    </g>
    <!-- B: >.>  (glance right) -->
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0;0;0;0" keyTimes="0;0.5;0.667;0.833;0.9;1" dur="6s" repeatCount="indefinite"/>
      <path d="M13 18 L20 23 L13 28"/>
      <path d="M27 18 L34 23 L27 28"/>
    </g>
    <!-- C: <.<  (glance left) -->
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;1;0;0;0" keyTimes="0;0.5;0.667;0.833;0.9;1" dur="6s" repeatCount="indefinite"/>
      <path d="M20 18 L13 23 L20 28"/>
      <path d="M35 18 L28 23 L35 28"/>
    </g>
    <!-- D: blink -.- -->
    <g opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;0;0;1;0;0" keyTimes="0;0.5;0.667;0.833;0.9;1" dur="6s" repeatCount="indefinite"/>
      <path d="M13 23 L21 23"/>
      <path d="M27 23 L35 23"/>
    </g>
  </g>
</svg>
